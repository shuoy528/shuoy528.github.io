{% comment %}
  Opens and closes an entry's abstract when its Abstract button is clicked.
  Keep comments out of the <script> itself: when the site is published, the
  theme squeezes each page onto one line, so a // comment there would turn
  the rest of the script into a comment and the buttons would stop working.
{% endcomment %}
<script>
  document.addEventListener('click', function (event) {
    var button = event.target.closest('.entry__toggle');
    if (!button) return;
    var panel = document.getElementById(button.getAttribute('aria-controls'));
    if (!panel) return;
    var isOpen = button.getAttribute('aria-expanded') === 'true';
    button.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
    panel.hidden = isOpen;
  });
</script>
